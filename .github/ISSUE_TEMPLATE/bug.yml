name: Bug report
description: Report a problem with the app.
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows version
      placeholder: e.g. 0.2.4 / Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, what you expected, and what happened instead. Reports in English, Chinese, Japanese, or Spanish are welcome. Remove private task names from screenshots; do not upload credentials or full conversation logs.
    validations:
      required: true
