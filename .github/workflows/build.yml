name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test portable usage, task, reset and unread rules
        run: python -m unittest tests.test_usage tests.test_tasks tests.test_period_usage tests.test_resets tests.test_unread tests.test_task_statistics tests.test_input_signals tests.test_attention_notices tests.test_diagnostics
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-build.txt
      - name: Test
        run: .venv/Scripts/python.exe -m unittest discover
      - name: Test complete widget journeys without desktop input
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/python.exe -m unittest tests.test_widget_journeys
      - name: Build application and installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: CodexTaskbarCompanion-windows-x64
          path: release/*
          if-no-files-found: error
