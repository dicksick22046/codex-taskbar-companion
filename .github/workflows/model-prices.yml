name: Check model prices
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - codex_taskbar/pricing.py
      - scripts/check_model_prices.py
      - scripts/standard_model_ids.txt
      - .github/workflows/model-prices.yml
permissions:
  contents: read
jobs:
  official-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare verified prices and model IDs
        run: python scripts/check_model_prices.py
