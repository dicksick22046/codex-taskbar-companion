name: Bug report
description: Report a problem with the app.
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows version
      placeholder: App version / Windows version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: In Settings → General, click Copy diagnostics and paste the report here. It excludes task names, account details, paths and log contents.
      render: json
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, what you expected, and what happened instead. Reports in English, Chinese, Japanese, or Spanish are welcome. Remove private task names from screenshots; do not upload credentials or full conversation logs.
    validations:
      required: true
